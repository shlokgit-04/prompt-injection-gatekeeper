<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in · Prompt-Injection Gatekeeper</title>
<link rel="stylesheet" href="app.css"/>
</head>
<body>
<div class="topbar"><div class="brand">Prompt-Injection Gatekeeper</div><div class="nav"><a href="register.html">Create account</a></div></div>
<div class="wrap" style="max-width:420px">
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Your audit log, approvals and policy are per-account.</p>
    <form id="f">
      <div class="row"><input id="email" type="email" placeholder="Email" required autocomplete="email"/></div>
      <div class="row"><input id="pw" type="password" placeholder="Password (min 8 characters)" required minlength="8" autocomplete="current-password"/></div>
      <div class="row"><button style="width:100%">Sign in</button></div>
    </form>
    <div id="msg"></div>
    <p class="sub" style="margin-top:12px">No account? <a href="register.html">Create one</a>.</p>
  </div>
</div>
<script src="config.js"></script>
<script>
document.querySelector("#f").addEventListener("submit",async e=>{
  e.preventDefault();
  const r=await fetch(config.API_BASE+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:document.querySelector("#email").value.trim(),password:document.querySelector("#pw").value})});
  const d=await r.json();
  if(r.status===200){localStorage.setItem("pg_token",d.token);location.href="index.html";}
  else document.querySelector("#msg").innerHTML=`<div class="msg err">${d.error||"Sign-in failed"}</div>`;
});
</script>
</body>
</html>
